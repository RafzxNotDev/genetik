name: Flutter Build APK

# Ditrigger oleh bot Telegram (Tirzz Build Bot) lewat workflow_dispatch.
# Input dikirim oleh server.js -> triggerWorkflow(). Simpan file ini di repo target
# (GITHUB_OWNER/GITHUB_REPO di .env bot) pada path: .github/workflows/flutter_build.yml
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter (GitHub Release asset)"
        required: true
        type: string
      tag:
        description: "Tag unik build (dipakai untuk nama artifact & release cleanup)"
        required: true
        type: string
      build_type:
        description: "Mode build: debug atau release"
        required: false
        default: "release"
        type: string
      base_url:
        description: "Base URL server API (opsional). Contoh: http://168.144.143.61:3168"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Validasi input wajib
        run: |
          if [ -z "${{ inputs.zip_url }}" ]; then
            echo "::error::Input zip_url kosong."
            exit 1
          fi
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::Input tag kosong."
            exit 1
          fi
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Keystore tetap: tanpa ini tiap runner bikin debug key baru, jadi APK
      # hasil build selalu beda tanda tangan dan tidak bisa update install lama.
      - name: Siapkan keystore rilis
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 kosong — build akan pakai debug signing."
            exit 0
          fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KeyStore siap ($(stat -c%s "$RUNNER_TEMP/release.jks") byte)"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # PENTING — JANGAN naikkan versi ini ke >= 3.44 kecuali font_awesome_flutter
      # di project kamu sudah di-upgrade ke v11+. Flutter 3.44 menjadikan class
      # IconData "final" (tidak bisa di-extend), yang membuat font_awesome_flutter
      # versi lama (mis. 10.12.0) gagal compile dengan error:
      #   "The class 'IconData' can't be extended outside of its library
      #    because it's a final class."
      # 3.41.x adalah rilis stabil terakhir SEBELUM breaking change tersebut.
      - name: Setup Flutter SDK (pinned 3.41.x, sebelum breaking change IconData final)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true
      - name: Download ZIP project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: curl -L --fail -o project.zip "$ZIP_URL"
      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -q project.zip -d project
          rm -rf project/__MACOSX

          # Cari pubspec.yaml sedalam apa pun, ambil yang paling dangkal,
          # lalu ratakan isinya ke project/ supaya flutter build jalan.
          ROOT="$(find project -name pubspec.yaml -not -path "*/build/*" -not -path "*/.dart_tool/*" -printf "%d %h\n" | sort -n | head -1 | cut -d" " -f2-)"
          if [ -z "$ROOT" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP."
            echo "Isi ZIP:"; find project -maxdepth 2 | head -50
            exit 1
          fi
          echo "Project root terdeteksi: $ROOT"
          if [ "$ROOT" != "project" ]; then
            shopt -s dotglob
            mv "$ROOT"/* project/ 2>/dev/null || true
            rm -rf "$ROOT"
          fi
          ls -la project | head -20
      - name: Validasi pubspec.yaml
        run: |
          if [ ! -f project/pubspec.yaml ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP. Pastikan ZIP berisi project Flutter yang valid (pubspec.yaml di root project)."
            exit 1
          fi
      - name: Flutter pub get
        working-directory: project
        run: flutter pub get

      - name: Analyze (laporan saja, tidak menggagalkan build)
        continue-on-error: true
        working-directory: project
        run: flutter analyze --no-fatal-infos || true
      - name: Build APK
        working-directory: project
        env:
          BASE_URL: ${{ inputs.base_url }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DEFINES=()
          if [ -n "${BASE_URL:-}" ]; then
            echo "Memakai BASE_URL dari input: $BASE_URL"
            DEFINES+=("--dart-define=BASE_URL=$BASE_URL")
          else
            echo "BASE_URL kosong — memakai default di lib/Qaxer/api.dart"
          fi

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug "${DEFINES[@]}"
          else
            flutter build apk --release "${DEFINES[@]}"
          fi
      - name: Upload APK sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Siapkan APK untuk release
        if: success()
        run: |
          set -euo pipefail
          APK="$(find project/build/app/outputs/flutter-apk -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/${{ inputs.tag }}.apk"
          ls -lh dist

      # Nama asset sengaja "<tag>.apk" supaya URL-nya bisa ditebak server:
      # https://github.com/OWNER/REPO/releases/download/apk-<tag>/<tag>.apk
      - name: Publish APK ke Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="apk-${{ inputs.tag }}"
          FILE="dist/${{ inputs.tag }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "APK ${{ inputs.tag }}" --notes "Build otomatis dari menu Build APK di aplikasi."
          fi
          echo "Link: https://github.com/${{ github.repository }}/releases/download/$TAG/${{ inputs.tag }}.apk"
